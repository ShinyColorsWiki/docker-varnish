name: Build

on:
  push:
    branches: [ master ]

jobs:
  docker:
    name: Docker image test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Build smoke-test image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        load: true
        tags: varnish:test
        pull: true

    - name: Test Varnish and exporter
      run: |
        docker run --rm varnish:test varnishd -V 2>&1 | grep 'varnish-9.1.0'
        docker run -d --name varnish-smoke --no-healthcheck varnish:test \
          sh -c 'docker-varnish-entrypoint & exec varnishlog'
        trap 'docker logs varnish-smoke; docker rm -f varnish-smoke' EXIT
        docker exec -d varnish-smoke prometheus_varnish_exporter
        for _ in $(seq 1 30); do
          if docker exec varnish-smoke curl -fsS http://127.0.0.1:9131/metrics > /tmp/varnish-metrics; then
            if grep -q '^varnish_up 1$' /tmp/varnish-metrics; then
              exit 0
            fi
          fi
          sleep 2
        done
        cat /tmp/varnish-metrics
        exit 1

    - name: Login to GitHub Container Registry
      if: ${{ github.repository_owner == 'ShinyColorsWiki' && github.ref == 'refs/heads/master' }}
      uses: docker/login-action@v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Quay.io Container Registry
      uses: docker/login-action@v4.8.0
      if: ${{ github.repository_owner == 'ShinyColorsWiki' && github.ref == 'refs/heads/master' }}
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}

    - name: Build a multi-platform docker image and push
      uses: docker/build-push-action@v7.4.0
      with:
        platforms: linux/amd64,linux/arm64
        pull: true
        cache-from: |
          ghcr.io/shinycolorswiki/varnish:latest
          type=local,src=/tmp/.buildx-cache
        cache-to: mode=max,type=inline
        load: false
        no-cache: ${{ contains(github.event.head_commit.message, '[no cache]') }}
        push: ${{ github.repository_owner == 'ShinyColorsWiki' && github.ref == 'refs/heads/master' }}
        tags: |
          ghcr.io/shinycolorswiki/varnish:latest
          ghcr.io/shinycolorswiki/varnish:${{ github.sha }}
          quay.io/shinycolorswiki/varnish:latest
          quay.io/shinycolorswiki/varnish:${{ github.sha }}
